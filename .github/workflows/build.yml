name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run audit-check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          SIZE=$(wc -c < dist/solaredge-card.js)
          echo "Bundle size: ${SIZE} bytes"
          if [ "$SIZE" -gt 262144 ]; then
            echo "ERROR: Bundle exceeds 256KB (${SIZE} bytes)"
            exit 1
          fi

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/solaredge-card.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
